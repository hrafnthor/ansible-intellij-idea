---
# Contains default values used for the role

# Defines the default installation path for Intellij IDEA
hth_intellij_default_path: /opt/jetbrains/intellij

# Defines the default path for desktop entry files
hth_intellij_default_desktop_entry_path: /usr/share/applications

# The host used when downloading archives
hth_intellij_default_host: https://download.jetbrains.com

# The path appended to the host when downloading archives
hth_intellij_default_url_path: "/idea/"

# Indicates if downloaded artifacts should be cleaned up when installation succeeds.
hth_intellij_default_cleanup_on_install: true
